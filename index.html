<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>dJ 計測</title>
<meta name="theme-color" content="#0F1E3A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="dJ計測">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="keisoku-180.png">
<link rel="icon" href="keisoku-192.png">
<style>
:root{--bg:#F1F3F6;--s:#fff;--sunk:#E7EAEF;--ink:#14181D;--mu:#5E6773;--line:#D6DBE1;--ac:#1D4ED8;--ac2:#E2E9FB;--ng:#C93030;--nav:#0F1E3A;
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;color:var(--ink);background:var(--bg);-webkit-text-size-adjust:100%}
@media(prefers-color-scheme:dark){:root{--bg:#0E1114;--s:#181C21;--sunk:#22272E;--ink:#E7EBEF;--mu:#98A2AD;--line:#2D333A;--ac:#7FA0FF;--ac2:#1F2A45;--ng:#F06464}}
*{box-sizing:border-box}html,body{touch-action:manipulation}body{margin:0;padding:env(safe-area-inset-top) 0 calc(env(safe-area-inset-bottom) + 24px)}
button,input,select{font:inherit;color:inherit}button{cursor:pointer;-webkit-tap-highlight-color:transparent}
input,select{background:var(--s);border:1px solid var(--line);border-radius:8px;height:42px;padding:0 10px;font-size:16px;width:100%;min-width:0}
.top{background:var(--nav);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:5}
.top h1{font-size:16px;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.top .ib{background:transparent;color:#fff;border-color:rgba(255,255,255,.35)}
.top .who{font-size:12px;opacity:.8;background:none;border:0;color:#fff;padding:4px}
.w{max-width:720px;margin:0 auto;padding:14px;display:flex;flex-direction:column;gap:12px}
.ib{border:1px solid var(--line);background:var(--s);border-radius:8px;height:34px;padding:0 10px;font-size:14px;white-space:nowrap}
.pr{background:var(--ac);color:#fff;border:0;border-radius:10px;min-height:46px;padding:0 16px;font-weight:700;font-size:15px}
.gh{background:var(--s);border:1px solid var(--line);border-radius:10px;min-height:44px;padding:0 14px;font-size:14px}
.dg{background:transparent;border:1px solid var(--ng);color:var(--ng);border-radius:10px;min-height:44px;padding:0 14px}
.pn{background:var(--s);border:1px solid var(--line);border-radius:14px;padding:14px}
.pn h2{font-size:14px;margin:0 0 10px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.hint{font-size:12px;color:var(--mu);margin:0;line-height:1.6}.empty{color:var(--mu);text-align:center;padding:16px 0;margin:0}
.f{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}.f label{font-size:11px;font-weight:700;color:var(--mu)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:420px){.two{grid-template-columns:1fr}}
.row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;align-items:center}.row .nm{flex:1 1 60%;min-width:0}.row .lab{flex:0 0 46px;text-align:center;font-weight:700}.row select{flex:0 0 auto;width:auto}
.foot{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}
.card{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--s);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.card b{display:block}.card small{color:var(--mu);font-size:12px}.card .n{margin-left:auto;font-weight:700;font-variant-numeric:tabular-nums}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}.tabs button{flex:0 0 auto;border:1px solid var(--line);background:var(--s);border-radius:999px;height:36px;padding:0 14px;font-size:13px;font-weight:700}
.tabs button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.cond{display:grid;grid-template-columns:auto 1fr 1fr;gap:6px 8px;align-items:center;font-size:12px;font-weight:700;color:var(--mu)}
.cond input{height:38px;text-align:center}.tm{display:flex;gap:4px}.tm .ib{height:38px;flex:0 0 auto}
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.chip{display:grid;grid-template-columns:auto 1fr;gap:0 8px;text-align:left;background:var(--s);border:2px solid var(--line);border-radius:12px;padding:8px 10px;min-height:58px;align-items:center}
.chip b{grid-row:1/3;font-size:22px;width:30px;text-align:center}.chip span{font-size:13px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.chip small{font-size:11px;color:var(--mu)}
.chip.on{border-color:var(--ac);background:var(--ac2)}
.pick{text-align:center;color:var(--mu);font-weight:700;padding:16px 0;margin:0}
.ent{background:var(--s);border:1px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:10px}
.now{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--mu);font-weight:700}.now b{color:var(--ac);font-size:15px;white-space:nowrap}
.disp{font-size:50px;font-weight:800;text-align:right;font-variant-numeric:tabular-nums;background:var(--sunk);border-radius:12px;padding:4px 14px;line-height:1.25}.disp.ph{color:var(--line)}.disp small{font-size:16px;color:var(--mu);margin-left:6px}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.keys button{height:60px;font-size:27px;font-weight:700;border:1px solid var(--line);background:var(--bg);border-radius:12px;touch-action:manipulation}
.keys button:active{background:var(--ac2)}
.acts{display:flex;gap:8px}.go{flex:1;font-size:21px;height:62px;border-radius:14px}.go:disabled{opacity:.35}
.st{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}.st div{background:var(--sunk);border-radius:10px;padding:8px}.st span{display:block;font-size:10px;color:var(--mu);font-weight:700}.st b{font-size:18px;font-variant-numeric:tabular-nums}
.ps{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px}
.ps button{border:1px solid var(--line);background:var(--s);border-radius:8px;padding:4px 2px;display:flex;flex-direction:column;align-items:center}.ps small{font-size:10px;color:var(--mu)}.ps b{font-size:15px;font-variant-numeric:tabular-nums}
.ps button.on{border-color:var(--ac);background:var(--ac2)}
.tb{overflow-x:auto}.tb table{border-collapse:collapse;width:100%;table-layout:fixed;font-size:13px}
.tb th,.tb td{border-bottom:1px solid var(--line);padding:6px 4px;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.tb thead th{text-align:center;vertical-align:bottom;white-space:normal}.tb thead th:first-child{width:56px}
.tb thead small{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:10px;color:var(--mu);font-weight:400;word-break:break-all;line-height:1.25}
.tb tbody th{text-align:left;font-size:11px;color:var(--mu)}.tb .me{background:var(--ac2)}.tb .sr td{font-weight:700}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#14181D;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:20;max-width:90vw}
.share{background:var(--ac2);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px}
.share code{font-size:12px;word-break:break-all;background:var(--s);padding:8px;border-radius:8px}
.line{background:#06C755;color:#fff;border:0;border-radius:10px;min-height:46px;font-weight:700;font-size:15px}
.err{background:#FDECEC;color:#8A1F1F;border-radius:12px;padding:12px;font-size:13px;line-height:1.6}
textarea{width:100%;min-height:200px;font-size:13px;border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--s)}
</style>
</head>
<body>
<div id="app"><div class="w"><p class="empty">読み込み中…</p></div></div>
<div id="toast" class="toast" hidden></div>
<script src="config.js"></script>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getFirestore,doc,setDoc,updateDoc,onSnapshot} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const app=initializeApp(window.KEISOKU_CONFIG);
const fs=getFirestore(app);
const UNITS=["m","秒","km/h","点",""];
const DOW="日月火水木金土";
const S={room:null,data:null,unsub:null,err:null,view:"list",sid:null,mi:0,ti:null,buf:"",edit:null,setup:null,grid:false,name:ls("kk.name")||""};
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,v)}catch(e){return null}}
const h=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad=n=>String(n).padStart(2,"0");
const todayS=()=>{const d=new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())};
const md=s=>{if(!s)return"";const[a,b,c]=s.split("-").map(Number);const d=new Date(a,b-1,c);return (b)+"/"+c+"("+DOW[d.getDay()]+")"};
const rid=(p,n=5)=>{const a="abcdefghijkmnpqrstuvwxyz23456789";let s=p;const r=crypto.getRandomValues(new Uint8Array(n));for(const x of r)s+=a[x%a.length];return s};
function toast(t){const el=document.getElementById("toast");el.textContent=t;el.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>el.hidden=true,2200)}
function recent(){try{return JSON.parse(ls("kk.recent")||"[]")}catch(e){return[]}}
function saveRecent(id,d){let r=recent().filter(x=>x.id!==id);r.unshift({id,title:d.title||"",venue:d.venue||"",day:d.day||"",at:Date.now()});ls("kk.recent",JSON.stringify(r.slice(0,30)))}
const roomUrl=id=>location.origin+location.pathname+"#"+id;

/* ---------- data helpers ---------- */
function sessions(){const s=(S.data&&S.data.s)||{};return Object.entries(s).filter(([k,v])=>v&&v.tires).map(([id,v])=>({id,...v})).sort((a,b)=>(a.day||"").localeCompare(b.day||"")||(a.createdAt||"").localeCompare(b.createdAt||""))}
function ses(id){const v=S.data&&S.data.s&&S.data.s[id];return v&&v.tires?{id,...v}:null}
const key=(m,t)=>m.id+"__"+t.id;
function full(r,m,t){const o=(r.v||{})[key(m,t)]||{};const a=[];for(const[k,v]of Object.entries(o)){const n=+k.slice(1);if(v==="x")a[n-1]="x";else if(v!==null&&v!==""&&isFinite(+v))a[n-1]=+v}return a}
function vals(r,m,t){const o=(r.v||{})[key(m,t)]||{};const a=[];for(const[k,v]of Object.entries(o)){const n=+k.slice(1);if(v!==null&&v!==""&&isFinite(+v))a[n-1]=+v}return a}
function maxPass(r,m){let n=0;(r.tires||[]).forEach(t=>n=Math.max(n,full(r,m,t).length));return n}
function stats(a){const x=a.filter(v=>v!==undefined);const n=x.length;if(!n)return{n:0,trim:null,f7:0};
  const avg=x.reduce((s,v)=>s+v,0)/n;const sd=n>1?Math.sqrt(x.reduce((s,v)=>s+(v-avg)**2,0)/(n-1)):null;
  const f7=[];for(let i=0;i<7;i++)if(a[i]!==undefined)f7.push(a[i]);
  const trim=f7.length===7?(f7.reduce((s,v)=>s+v,0)-Math.max(...f7)-Math.min(...f7))/5:null;return{n,avg,sd,trim,f7:f7.length}}
const plab=(r,p,short)=>{const n=+r.ppl||0,l=+r.laps||1;if(!n)return short?"P"+p:"Pass "+p;const who=Math.ceil(p/l),lap=(p-1)%l+1;return short?`${who}-${lap}`:`${who}人目 ${lap}周目`};
const COLS=[["y","黄","#F2E21B","#111"],["r","赤","#E8343A","#fff"],["b","青","#2A9BE0","#fff"],["g","緑","#2FB35A","#fff"],["o","オレンジ","#F28C1B","#111"],["p","紫","#8A4FD8","#fff"],["k","グレー","#9AA3AD","#111"]];
const tcol=(t,i)=>COLS.find(c=>c[0]===t.col)||COLS[i%COLS.length];
const rf=(v,d=2)=>v===null||v===undefined||!isFinite(v)?"—":(+v).toFixed(d);
function applyLocal(upd){for(const[k,v]of Object.entries(upd)){const ks=k.split(".");let c=S.data;for(let i=0;i<ks.length-1;i++){if(!c[ks[i]]||typeof c[ks[i]]!=="object")c[ks[i]]={};c=c[ks[i]]}c[ks[ks.length-1]]=v}}
function upd(u){const full={...u,updatedAt:new Date().toISOString()};applyLocal(full);render();
  return updateDoc(doc(fs,"keisoku",S.room),full).then(()=>true).catch(e=>{console.warn(e);toast(e&&e.code==="permission-denied"?"保存できません(Firebaseのルール設定がまだかも)":"保存できませんでした。電波を確認してね");return false})}

/* ---------- room ---------- */
function openRoom(id){
  if(S.unsub)S.unsub();S.room=id;S.data=null;S.err=null;S.view="room";S.sid=ls("kk.sid."+id)||null;S.ti=null;S.buf="";S.edit=null;S.setup=null;render();
  S.unsub=onSnapshot(doc(fs,"keisoku",id),snap=>{
    if(!snap.exists()){S.err="nf";render();return}
    S.data=snap.data();saveRecent(id,S.data);
    if(S.view==="room"&&!S.setup){const ss=sessions();if(!S.sid||!ses(S.sid))S.sid=ss.length?ss[ss.length-1].id:null}
    render();
  },e=>{console.warn(e);S.err=e&&e.code==="permission-denied"?"perm":"net";render()});
}
async function createRoom(d){
  const id=rid("",12);const body={title:d.title.trim(),venue:d.venue.trim(),day:d.day,s:{},createdAt:new Date().toISOString(),createdBy:S.name||"",updatedAt:new Date().toISOString()};
  try{await setDoc(doc(fs,"keisoku",id),body)}catch(e){console.warn(e);toast(e&&e.code==="permission-denied"?"作れませんでした(Firebaseのルール設定がまだかも)":"作れませんでした。電波を確認してね");return}
  saveRecent(id,body);location.hash=id;S.justMade=true;
}
function defaultSession(){
  const ss=sessions();const prev=ss[ss.length-1];
  const ms=prev?prev.ms.map(m=>({...m})):[{id:rid("m"),name:"20-0km",unit:"m"}];
  const tires=prev?prev.tires.map(t=>({...t})):["A","B","C","D"].map((l,i)=>({id:rid("t"),lab:l,name:"",role:i?"比較":"基準"}));
  const d0=(S.data&&S.data.day)||todayS();
  return{ppl:prev?prev.ppl??12:12,laps:prev?prev.laps??2:2,day:prev?prev.day:d0,title:"",car:prev?prev.car||"":"",size:prev?prev.size||"":"",air:prev?prev.air||"":"",note:"",ms,tires};
}

/* ---------- render ---------- */
function render(){
  const a=document.activeElement;
  if(a&&/INPUT|SELECT|TEXTAREA/.test(a.tagName)&&!S.force){S.defer=true;return}
  S.force=false;
  const y=window.scrollY;document.getElementById("app").innerHTML=view();window.scrollTo(0,y);
}
function top(title,left="",right=""){return `<header class="top">${left}<h1>${title}</h1>${right}<button class="who" data-a="name">${h(S.name||"名前未設定")}</button></header>`}
function view(){
  if(!S.name)return top("dJ 計測")+`<div class="w"><section class="pn"><h2>はじめに名前を入れてね</h2><p class="hint" style="margin-bottom:10px">誰がどのタイヤを入れたか、みんなの画面に出るよ。</p><div class="f"><input id="nm" placeholder="例: もえの" autocomplete="nickname"></div><button class="pr" style="width:100%" data-a="setName">OK</button></section></div>`;
  if(S.view==="list")return listView();
  if(S.err==="nf")return top("dJ 計測",`<button class="ib" data-a="home">‹</button>`)+`<div class="w"><p class="err">この記録は見つかりませんでした。URLが途中で切れていないか確認してね。</p></div>`;
  if(S.err)return top("dJ 計測",`<button class="ib" data-a="home">‹</button>`)+`<div class="w"><p class="err">${S.err==="perm"?"読み込めませんでした。Firebaseのルール設定(計測用)がまだ入っていないかも。":"読み込めませんでした。電波を確認して、もう一度開いてね。"}</p><button class="gh" data-a="reload">もう一度読み込む</button></div>`;
  if(!S.data)return top("dJ 計測",`<button class="ib" data-a="home">‹</button>`)+`<div class="w"><p class="empty">読み込み中…</p></div>`;
  if(S.setup)return setupView();
  if(S.graph)return graphView();
  return roomView();
}
function listView(){
  const r=recent();
  const mk=S.mk||{title:"",venue:"",day:todayS()};
  return top("dJ 計測")+`<div class="w">
  <p class="hint">記録をつくって、URLをLINEで送ると、受け取った人もその場で一緒に入力できるよ。アカウントはいらない。</p>
  ${S.making?`<section class="pn"><h2>新しい記録</h2>
    <div class="f"><label>名前(試乗会・テストの名前)</label><input data-k="title" value="${h(mk.title)}" placeholder="例: 北海道 9月 ブリヂストン"></div>
    <div class="two"><div class="f"><label>会場</label><input data-k="venue" value="${h(mk.venue)}" placeholder="例: 邦和アイスリンク"></div><div class="f"><label>開始日</label><input type="date" data-k="day" value="${h(mk.day)}"></div></div>
    <div class="foot"><button class="gh" data-a="cancelMake">やめる</button><button class="pr" data-a="make">つくる</button></div></section>`
  :`<button class="pr" data-a="startMake">＋ 新しい記録をつくる</button>`}
  <h2 style="font-size:13px;color:var(--mu);margin:8px 0 0">最近ひらいた記録</h2>
  ${r.length?r.map(x=>`<button class="card" data-a="open" data-id="${h(x.id)}"><span><b>${h(x.title||"(名前なし)")}</b><small>${h([x.venue,md(x.day)].filter(Boolean).join(" ・ "))}</small></span><span class="n">›</span></button>`).join(""):`<p class="empty">まだありません。LINEで届いたURLを開くとここに出るよ</p>`}
  </div>`;
}
function setupView(){
  const d=S.setup.d,isNew=!S.setup.id;
  const f=(k,l,ph="",type="text")=>`<div class="f"><label>${l}</label><input type="${type}" data-s="${k}" value="${h(d[k]||"")}" placeholder="${ph}"></div>`;
  const tr=d.tires.map((t,i)=>`<div class="row"><input class="lab" data-s="tires.${i}.lab" value="${h(t.lab)}" placeholder="A" aria-label="記号"><input class="nm" data-s="tires.${i}.name" value="${h(t.name)}" placeholder="例: DL WM ICE Pro" aria-label="タイヤ名"><select data-s="tires.${i}.role" aria-label="区分">${["基準","比較",""].map(o=>`<option value="${o}" ${t.role===o?"selected":""}>${o||"—"}</option>`).join("")}</select><input data-s="tires.${i}.who" value="${h(t.who||"")}" placeholder="担当(例: もえの)" aria-label="担当" style="flex:1 1 30%;min-width:0"><select data-s="tires.${i}.col" aria-label="グラフの色" style="width:auto">${COLS.map((c,k)=>`<option value="${c[0]}" ${(t.col||COLS[i%COLS.length][0])===c[0]?"selected":""}>${c[1]}</option>`).join("")}</select><button class="ib" data-a="tDel" data-i="${i}" aria-label="消す">✕</button></div>`).join("");
  const mr=d.ms.map((m,i)=>`<div class="row"><input data-s="ms.${i}.name" value="${h(m.name)}" placeholder="例: 20-0km / ACC / LAP TIME" aria-label="測定項目"><select data-s="ms.${i}.unit" aria-label="単位">${UNITS.map(o=>`<option value="${o}" ${m.unit===o?"selected":""}>${o||"単位なし"}</option>`).join("")}</select>${d.ms.length>1?`<button class="ib" data-a="mDel" data-i="${i}" aria-label="消す">✕</button>`:""}</div>`).join("");
  return top(isNew?"シートを追加":"シートの設定",`<button class="ib" data-a="setupCancel">‹</button>`)+`<div class="w">
  <section class="pn"><div class="two">${f("day","日付","","date")}${f("title","シート名","例: AM 参加者試乗")}</div>
  <div class="two">${f("car","車両","例: TOYOTA COROLLA Touring-AWD HB")}${f("size","タイヤサイズ","例: 205/55R16")}</div>
  <div class="two">${f("air","空気圧","例: 250/240kPa")}${f("note","メモ","例: テスト車両4台使用")}</div>
  <div class="two">${f("ppl","参加者の人数","例: 12","number")}${f("laps","1人の周回数","例: 2","number")}</div><p class="hint">参加者試乗なら人数と周回数を入れると「3人目 2周目」みたいに進む。DEMOやテストで回数だけ数えるなら人数を空にしてね。</p></section>
  <section class="pn"><h2>タイヤ</h2><p class="hint" style="margin-bottom:8px">記号・タイヤ名・基準/比較。この順で表になるよ。</p>${tr}<button class="gh" data-a="tAdd">＋ タイヤを追加</button></section>
